<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offer Not Found</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:#fff;
  text-align:center;
  padding:20px;
}

.box{
  max-width:420px;
  width:100%;
  animation:fadeUp .9s ease;
}

.box img{
  width:100%;
  max-width:200px;
  margin-bottom:24px;
  animation:float 3s ease-in-out infinite;
}

.box h1{
  font-size:clamp(1.6rem,5vw,2.2rem);
  font-weight:700;
  margin-bottom:10px;
}

.box p{
  font-size:clamp(.9rem,3.5vw,1rem);
  opacity:.85;
  margin-bottom:24px;
}

/* Button */
.box a{
  display:inline-block;
  padding:12px 26px;
  border-radius:30px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  font-weight:500;
  transition:.3s ease;
}

.box a:hover{
  background:#1e40af;
  transform:translateY(-2px);
}

/* Animations */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes float{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-12px); }
}

/* Small screens */
@media(max-width:480px){
  .box img{
    max-width:160px;
  }
}
</style>
</head>

<body>
  <div class="box">
    <img src="404-error.png" alt="404 Error">
    <h1>Offer Not Found/Paused</h1>
    <p>The page you’re looking for doesn’t exist or was moved.</p>
    <a href="">Go Home</a>
  </div>
</body>
</html>
