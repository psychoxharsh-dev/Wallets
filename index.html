<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<script>
(function () {
  var API = 'https://cash-flix-dytv.onrender.com';
  var routeCid = new URLSearchParams(window.location.search).get('cid');
  if (!routeCid) {
    // new style: /Offer/<cid>?source=...
    var m = window.location.pathname.match(/^\/offer\/([^\/?#]+)/i);
    if (m) { try { routeCid = decodeURIComponent(m[1]); } catch (e) { routeCid = m[1]; } }
  }

  function paused() {
    document.body.innerHTML = '<h2 style="text-align:center;margin-top:40px;font-family:sans-serif;">Offer Temporary Paused</h2>';
  }
  function notFound() { window.location.replace('/404.html'); }

  if (!routeCid) { notFound(); return; }

  fetch(API + '/route?cid=' + encodeURIComponent(routeCid))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.file) return notFound();
      return fetch('/offers/' + d.file + '.html')
        .then(function (r) { return r.text(); })
        .then(function (html) { document.open(); document.write(html); document.close(); });
    })
    .catch(paused);
})();
</script>
</body>
</html>
