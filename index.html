<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<script>
const SERVER = 'https://cash-flix-dytv.onrender.com';
const cid = new URLSearchParams(window.location.search).get('cid');

function paused() {
  document.body.innerHTML = '<h2 style="text-align:center;margin-top:40px;font-family:sans-serif;">Offer Temporary Paused</h2>';
}

if (!cid) {
  paused();
} else {
  fetch(SERVER + '/route?cid=' + encodeURIComponent(cid))
    .then(r => r.json())
    .then(d => {
      if (!d.file) return paused();
      return fetch('/offers/' + d.file + '.html')
        .then(r => r.text())
        .then(html => { document.open(); document.write(html); document.close(); });
    })
    .catch(paused);
}
</script>
</body>
</html>
