<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f7f1e3;--card:#fffdf7;--line:#ece3cc;--ink:#1c1c1c;--ink2:#3a3a3a;--mut:#9d9d9d;--gold:#e8c97a;--gold2:#f0dfae;--cream:#fdf6e3;--ok:#23895a;--okbg:#e4f4ea;--warn:#b3730f;--warnbg:#fdf0d5;--err:#e53935;--errbg:#fde8e7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:linear-gradient(135deg,#f7f1e3,#fbf7ec,#f0dfae);background-size:200% 200%;animation:bgMove 18s ease infinite;padding:16px;color:var(--ink);overflow-x:hidden}
@keyframes bgMove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(70px);background:rgba(232,201,122,.35);pointer-events:none;z-index:0}
.orb.one{width:260px;height:260px;top:-60px;left:-60px}.orb.two{width:300px;height:300px;bottom:-80px;right:-80px}
.container{position:relative;z-index:1;width:100%;max-width:460px;margin:auto;background:rgba(255,253,247,.92);border:1px solid var(--line);border-radius:26px;padding:26px 20px;box-shadow:0 18px 50px rgba(60,40,10,.14)}
.header{text-align:center;margin-bottom:18px}
.logo{width:74px;height:74px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#1c1c1c,#3a3a3a);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:30px;font-weight:700;box-shadow:0 8px 20px rgba(28,28,28,.25),0 0 0 4px var(--gold2)}
h1{font-size:24px;font-weight:700;color:var(--ink)}
.subtitle{font-size:13px;color:var(--ink2);margin-top:4px;font-weight:500}
.field{position:relative;margin-bottom:14px}
.field>i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#b3730f;font-size:15px}
.field input{width:100%;padding:15px 18px 15px 48px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:500 14px 'Poppins',sans-serif;color:var(--ink);outline:none;transition:.2s}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,201,122,.3)}
.field input::placeholder{color:var(--mut)}
.field input[readonly]{background:var(--cream);color:var(--ink2)}
.daterange-wrap{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 44px;transition:.2s}
.daterange-wrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,201,122,.3)}
.daterange-wrap input{border:0!important;box-shadow:none!important;padding:11px 2px!important;background:transparent!important;min-width:0;flex:1;font-size:13px!important;border-radius:0!important}
.daterange-sep{font-size:12px;color:var(--mut);font-weight:600}
.submit-btn{width:100%;padding:15px;border:0;border-radius:999px;background:linear-gradient(135deg,#1c1c1c,#3a3a3a);color:var(--gold);font:600 14px 'Poppins',sans-serif;letter-spacing:.6px;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(28,28,28,.25);transition:.2s}
.submit-btn:active{transform:scale(.98)}.submit-btn:disabled{opacity:.6}
.copy-btn{background:linear-gradient(135deg,#e8c97a,#f0dfae);color:#1c1c1c;box-shadow:0 8px 20px rgba(232,201,122,.5)}
.step-card-vertical{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(60,40,10,.06);animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row-line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row-line:last-child{border-bottom:0}
.label{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.7px}
.value{font-weight:600;color:var(--ink);text-align:right;word-break:break-word}
.badge{padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600}
.badge.success{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.err{background:var(--errbg);color:var(--err)}
#page-loader{position:fixed;inset:0;background:rgba(247,241,227,.8);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50}
#page-loader.show{display:flex}
.loader-box{background:#fff;border:1px solid var(--line);padding:22px 30px;border-radius:20px;text-align:center;box-shadow:0 14px 40px rgba(60,40,10,.2)}
.spinner{width:38px;height:38px;border:4px solid var(--gold2);border-top-color:#1c1c1c;border-radius:50%;margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader-text{font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#1c1c1c;color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:var(--err)}.toast.success{background:var(--ok)}

.sumbar{display:flex;gap:8px;margin-bottom:14px}.sumbar div{flex:1;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.sumbar b{display:block;font-size:15px;color:var(--ink)}.sumbar span{font-size:10.5px;color:var(--mut);font-weight:600;letter-spacing:.5px}
.sumbar .g b{color:var(--ok)}.sumbar .w b{color:var(--warn)}
.hint{font-size:11.5px;color:var(--mut);text-align:center;margin-top:12px}
</style></head><body>
<div id="page-loader"><div class="loader-box"><div class="spinner"></div><div class="loader-text">Processing...</div></div></div>
<div class="orb one"></div><div class="orb two"></div>
<div class="container">
  <div class="header" id="pageHeader"><div class="logo"><i class="fas fa-chart-line"></i></div><h1>Lead Tracker</h1><p class="subtitle" id="offerName">Enter your UPI ID to see your status</p></div>
  <form id="leadForm" onsubmit="return false">
    <div class="field"><i class="fas fa-university"></i><input type="text" id="upi_address" placeholder="Enter UPI ID" autocapitalize="off" autocomplete="off" required></div>
    <div class="field daterange-field"><i class="fas fa-calendar"></i><div class="daterange-wrap"><input type="date" id="from_date" required><span class="daterange-sep">to</span><input type="date" id="to_date" required></div></div>
    <button type="button" class="submit-btn" id="trackBtn" onclick="trackNow()"><span>Track Now</span><i class="fas fa-arrow-right"></i></button>
    <p class="hint">Today's date is selected by default. Change the dates to see older activity.</p>
  </form>
  <div id="resultSearchBox" style="display:none;margin-bottom:14px"><div class="field"><i class="fas fa-search"></i><input type="text" id="resultSearch" placeholder="Search in results..." oninput="filterResults()"></div></div>
  <div id="summary"></div>
  <div id="results"></div>
  <div id="searchAgain" style="display:none;text-align:center;margin-top:14px"><button class="submit-btn" onclick="resetSearch()"><i class="fas fa-arrow-left"></i> Search Again</button></div>
</div>
<div id="toast" class="toast"></div>
<script>
let API='https://cash-flix-dytv.onrender.com';
try{const q=new URLSearchParams(location.search).get('api');if(q&&(location.protocol==='file:'||/^(localhost|127\.)/.test(location.hostname)))API=q;}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+(Math.round((+n||0)*100)/100).toString();
function toast(m,t){const e=$('#toast');e.className='toast '+(t||'info')+' show';e.textContent=m;clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),3500)}
function istDate(iso){if(!iso)return'--';return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Kolkata'})}
function istTime(iso){if(!iso)return'--';return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true,timeZone:'Asia/Kolkata'})}
function todayIST(){return new Date(Date.now()+19800000).toISOString().slice(0,10)}
const row=(l,v,raw)=>'<div class="row-line"><span class="label">'+l+'</span>'+(raw?v:'<span class="value">'+esc(v)+'</span>')+'</div>';
const badge=(t,c)=>'<span class="badge '+c+'">'+t+'</span>';
function payBadge(p){if(!p)return'';if(p.status==='paid')return badge('Paid','success');if(p.status==='cancelled')return badge('Cancelled','err');if(p.status==='failed')return badge('Retrying','warn');return badge('To be paid','warn')}
function card(rows){return '<div class="step-card-vertical"><div class="step-text-vertical">'+rows.join('')+'</div></div>'}
function trackNow(){
  const upi=$('#upi_address').value.trim().toLowerCase(),from=$('#from_date').value,to=$('#to_date').value;
  if(!upi||!from||!to){toast('Please fill all fields','error');return}
  if(from>to){toast('From date must be on or before To date','error');return}
  $('#page-loader').classList.add('show');$('#trackBtn').disabled=true;
  fetch(API+'/upi/track?upi='+encodeURIComponent(upi)+'&from='+from+'&to='+to).then(r=>r.json()).then(j=>{
    $('#page-loader').classList.remove('show');$('#trackBtn').disabled=false;
    if(!j.ok){toast(j.error||'Something went wrong','error');return}
    render(j,from,to);
  }).catch(()=>{$('#page-loader').classList.remove('show');$('#trackBtn').disabled=false;toast('Something went wrong','error')});
}
function render(j,from,to){
  const inR=t=>{const d=new Date(new Date(t).getTime()+19800000).toISOString().slice(0,10);return d>=from&&d<=to};
  $('#pageHeader').style.display='none';$('#leadForm').style.display='none';$('#resultSearchBox').style.display='block';
  const P=j.payouts||[];let html='',sl=1,n=0;
  const used=new Set();
  (j.items||[]).forEach(it=>{
    if(it.events.length){it.events.forEach(ev=>{
      const pi=P.findIndex((p,i)=>!used.has(i)&&p.kind==='offer'&&p.offer===it.offer&&String(p.event).toLowerCase()===String(ev.event).toLowerCase());
      const p=pi>=0?P[pi]:null;if(pi>=0)used.add(pi);
      const r=[row('SL NO.',sl++),row('OFFER',it.offer),row('EVENT',ev.event),row('STATUS','✓ Confirmed'.replace(/^/,''),0)];
      r[3]=row('STATUS',badge('✓ Confirmed','success'),1);
      if(ev.amount>0)r.push(row('AMOUNT',money(ev.amount)));
      if(p)r.push(row('PAYOUT',payBadge(p),1));
      if(p&&p.utr)r.push(row('UTR',p.utr));
      r.push(row('DATE',istDate(ev.track_time)),row('TIME',istTime(ev.track_time)));html+=card(r);n++;
    })}else{
      html+=card([row('SL NO.',sl++),row('OFFER',it.offer),row('EVENT','Click (link opened)'),row('STATUS',badge('Waiting for event','warn'),1),row('DATE',istDate(it.click_time)),row('TIME',istTime(it.click_time))]);n++;
    }
  });
  P.forEach((p,i)=>{if(used.has(i)||p.kind==='offer'||p.kind==='form'||!inR(p.time))return;
    const t=p.kind==='refer_ref'?'Refer bonus (friend joined)':p.kind==='refer_new'?'Welcome refer bonus':'Bonus';
    html+=card([row('SL NO.',sl++),row('EVENT',t),row('STATUS',badge('✓ Confirmed','success'),1),row('AMOUNT',money(p.amount)),row('PAYOUT',payBadge(p),1),row('DATE',istDate(p.time)),row('TIME',istTime(p.time))]);n++});
  (j.forms||[]).filter(f=>inR(f.time)).forEach(f=>{
    const b=f.status==='approved'?badge('✓ Approved','success'):f.status==='rejected'?badge('Rejected','err'):badge('Under review','warn');
    const r=[row('SL NO.',sl++),row('OFFER',f.offer||'Form'),row('EVENT','Proof submitted'),row('STATUS',b,1)];
    if(f.status==='rejected'&&f.reason)r.push(row('REASON',f.reason));
    if(f.amount>0)r.push(row('AMOUNT',money(f.amount)));
    r.push(row('DATE',istDate(f.time)),row('TIME',istTime(f.time)));html+=card(r);n++});
  const t=j.totals||{};
  $('#summary').innerHTML='<div class="sumbar"><div><b>'+money(t.earned)+'</b><span>EARNED</span></div><div class="w"><b>'+money(t.pending)+'</b><span>PENDING</span></div><div class="g"><b>'+money(t.paid)+'</b><span>PAID</span></div></div>';
  $('#results').innerHTML=n?html:card([row('STATUS','No Records Found')]);
  $('#searchAgain').style.display='block';
}
function filterResults(){const q=$('#resultSearch').value.toLowerCase();document.querySelectorAll('#results .step-card-vertical').forEach(c=>{c.style.display=c.textContent.toLowerCase().includes(q)?'':'none'})}
function resetSearch(){$('#results').innerHTML='';$('#summary').innerHTML='';$('#searchAgain').style.display='none';$('#resultSearchBox').style.display='none';$('#resultSearch').value='';$('#pageHeader').style.display='';$('#leadForm').style.display=''}
const SLUG=(()=>{const q=new URLSearchParams(location.search).get('cid');if(q)return q;const m=location.pathname.split('/').filter(Boolean);const l=m[m.length-1]||'';return /\.html?$/.test(l)||/^(Refer|Tracker|User)$/i.test(l)?'':l})();
document.addEventListener('DOMContentLoaded',()=>{const t=todayIST();$('#from_date').value=t;$('#to_date').value=t;$('#from_date').max=t;$('#to_date').max=t;
  const u=new URLSearchParams(location.search).get('upi');if(u){$('#upi_address').value=u}});
</script></body></html>
