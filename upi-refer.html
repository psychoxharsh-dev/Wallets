<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Refer & Earn</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f7f1e3;--card:#fffdf7;--line:#ece3cc;--ink:#1c1c1c;--ink2:#3a3a3a;--mut:#9d9d9d;--gold:#e8c97a;--gold2:#f0dfae;--cream:#fdf6e3;--ok:#23895a;--okbg:#e4f4ea;--warn:#b3730f;--warnbg:#fdf0d5;--err:#e53935;--errbg:#fde8e7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:linear-gradient(135deg,#f7f1e3,#fbf7ec,#f0dfae);background-size:200% 200%;animation:bgMove 18s ease infinite;padding:16px;color:var(--ink);overflow-x:hidden}
@keyframes bgMove{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(70px);background:rgba(232,201,122,.35);pointer-events:none;z-index:0}
.orb.one{width:260px;height:260px;top:-60px;left:-60px}.orb.two{width:300px;height:300px;bottom:-80px;right:-80px}
.container{position:relative;z-index:1;width:100%;max-width:460px;margin:auto;background:rgba(255,253,247,.92);border:1px solid var(--line);border-radius:26px;padding:26px 20px;box-shadow:0 18px 50px rgba(60,40,10,.14)}
.header{text-align:center;margin-bottom:18px}
.logo{width:74px;height:74px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#1c1c1c,#3a3a3a);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:30px;font-weight:700;box-shadow:0 8px 20px rgba(28,28,28,.25),0 0 0 4px var(--gold2)}
h1{font-size:24px;font-weight:700;color:var(--ink)}
.subtitle{font-size:13px;color:var(--ink2);margin-top:4px;font-weight:500}
.field{position:relative;margin-bottom:14px}
.field>i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#b3730f;font-size:15px}
.field input{width:100%;padding:15px 18px 15px 48px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:500 14px 'Poppins',sans-serif;color:var(--ink);outline:none;transition:.2s}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,201,122,.3)}
.field input::placeholder{color:var(--mut)}
.field input[readonly]{background:var(--cream);color:var(--ink2)}
.daterange-wrap{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 44px;transition:.2s}
.daterange-wrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,201,122,.3)}
.daterange-wrap input{border:0!important;box-shadow:none!important;padding:11px 2px!important;background:transparent!important;min-width:0;flex:1;font-size:13px!important;border-radius:0!important}
.daterange-sep{font-size:12px;color:var(--mut);font-weight:600}
.submit-btn{width:100%;padding:15px;border:0;border-radius:999px;background:linear-gradient(135deg,#1c1c1c,#3a3a3a);color:var(--gold);font:600 14px 'Poppins',sans-serif;letter-spacing:.6px;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(28,28,28,.25);transition:.2s}
.submit-btn:active{transform:scale(.98)}.submit-btn:disabled{opacity:.6}
.copy-btn{background:linear-gradient(135deg,#e8c97a,#f0dfae);color:#1c1c1c;box-shadow:0 8px 20px rgba(232,201,122,.5)}
.step-card-vertical{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(60,40,10,.06);animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row-line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row-line:last-child{border-bottom:0}
.label{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.7px}
.value{font-weight:600;color:var(--ink);text-align:right;word-break:break-word}
.badge{padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600}
.badge.success{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.err{background:var(--errbg);color:var(--err)}
#page-loader{position:fixed;inset:0;background:rgba(247,241,227,.8);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50}
#page-loader.show{display:flex}
.loader-box{background:#fff;border:1px solid var(--line);padding:22px 30px;border-radius:20px;text-align:center;box-shadow:0 14px 40px rgba(60,40,10,.2)}
.spinner{width:38px;height:38px;border:4px solid var(--gold2);border-top-color:#1c1c1c;border-radius:50%;margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader-text{font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#1c1c1c;color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:var(--err)}.toast.success{background:var(--ok)}

.expand-card{display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:0;transition:.2s}
.expand-card.active{border-color:var(--gold);background:var(--cream)}
.step-number-vertical{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1c1c1c,#3a3a3a);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px}
.step-text-vertical{flex:1;font-weight:600;font-size:14px}
.expand-arrow{color:var(--mut);transition:transform .3s}.expand-card.active .expand-arrow{transform:rotate(180deg)}
.custom-expand-box{height:0;overflow:hidden;transition:height .35s ease}
.custom-expand-inner{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px}
.cm-row{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px dashed var(--line);font-size:13px;font-weight:500}
.cm-row>i{color:#b3730f;width:18px;text-align:center}.cm-row>span{flex:1}.cm-row strong{font-weight:700}
.cm-row.highlight{background:var(--cream);border-radius:12px;border-bottom:0;margin-bottom:4px}
.cm-input{width:90px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font:600 13px 'Poppins',sans-serif;text-align:right;outline:none}
.cm-input:focus{border-color:var(--gold)}
.cm-btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:999px;background:linear-gradient(135deg,#e8c97a,#f0dfae);color:#1c1c1c;font:600 13px 'Poppins',sans-serif;cursor:pointer}
.linkbox{display:none;margin-top:16px}.linkbox.show{display:block;animation:up .35s both}
.linkbox .submit-btn{margin-top:10px}
.note{font-size:11.5px;color:var(--mut);text-align:center;margin-top:12px;line-height:1.5}
</style></head><body>
<div id="page-loader"><div class="loader-box"><div class="spinner"></div><div class="loader-text">Processing...</div></div></div>
<div class="orb one"></div><div class="orb two"></div>
<div class="container">
  <div class="header"><div class="logo"><i class="fas fa-gift"></i></div><h1>Refer &amp; Earn</h1>
    <p class="subtitle"><span id="offerName">Loading</span> - Rs. <span id="subtitleAmount">0</span>/-</p></div>
  <form id="leadForm" onsubmit="return false">
    <div class="field"><i class="fas fa-university"></i><input type="text" id="upi_address" placeholder="ENTER UPI ID" autocapitalize="off" autocomplete="off" required></div>
    <button type="button" class="submit-btn" id="submit_btn" onclick="referNow()"><span>SUBMIT</span></button>
  </form>
  <div class="linkbox" id="linkBox">
    <div class="field" style="margin-bottom:0"><i class="fas fa-link"></i><input type="text" id="referLink" readonly></div>
    <button class="submit-btn copy-btn" onclick="copyLink()"><i class="fas fa-copy"></i><span>COPY REFER LINK</span></button>
    <p class="note" id="linkNote"></p>
  </div>
  <div style="margin-top:18px" id="customWrap">
    <div class="step-card-vertical expand-card" onclick="toggleCustomBox()"><div class="step-number-vertical"><i class="fas fa-coins"></i></div><div class="step-text-vertical">Custom Refer</div><i class="fas fa-chevron-down expand-arrow"></i></div>
    <div class="custom-expand-box" id="customExpandBox"><div class="custom-expand-inner">
      <div class="cm-row highlight"><i class="fas fa-wallet"></i><span>Total Payout</span><strong>₹<span id="cm_total">0</span></strong></div>
      <div class="cm-row"><i class="fas fa-user"></i><span>User</span><input type="number" id="cm_user" class="cm-input" min="0" step="0.5"></div>
      <div class="cm-row" style="border-bottom:0"><i class="fas fa-hand-holding-usd"></i><span>Your Cashback</span><strong>₹<span id="cm_you">0</span></strong></div>
      <button class="cm-btn" onclick="applyCustomAmount()">Apply Custom Amount</button>
    </div></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
let API='https://cash-flix-dytv.onrender.com';
try{const q=new URLSearchParams(location.search).get('api');if(q&&(location.protocol==='file:'||/^(localhost|127\.)/.test(location.hostname)))API=q;}catch(e){}
const $=s=>document.querySelector(s);
const r2=n=>Math.round((+n||0)*100)/100;
function toast(m,t){const e=$('#toast');e.className='toast '+(t||'info')+' show';e.textContent=m;clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),3500)}
const UPI_RE=/^[a-z0-9._-]{2,40}@[a-z][a-z0-9]{1,30}$/;
let CID=(()=>{const q=new URLSearchParams(location.search).get('cid');if(q)return q;const m=location.pathname.split('/').filter(Boolean);const l=m[m.length-1]||'';return /\.html?$/.test(l)||/^(Refer|Tracker|User)$/i.test(l)?'':l})();
let TOTAL=0,FINAL_USER=0,FINAL_YOU=0,CUSTOM=true,CUSTOM_SET=false,ENABLED=true;
function animateNumber(el,to){const start=parseFloat(el.textContent)||0;let t0=null;
  function step(t){if(!t0)t0=t;const p=Math.min((t-t0)/350,1);const v=start+(to-start)*p;el.textContent=p<1?(Math.round(v*100)/100):to;if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}
function toggleCustomBox(force){
  const box=$('#customExpandBox'),inner=box.querySelector('.custom-expand-inner'),card=document.querySelector('.expand-card');
  const open=box.classList.contains('open');if(force==='close'&&!open)return;
  if(!open&&force!=='close'){card.classList.add('active');box.classList.add('open');box.style.height='0px';box.offsetHeight;
    requestAnimationFrame(()=>{box.style.height=inner.scrollHeight+'px'});
    $('#cm_total').textContent=TOTAL;$('#cm_user').value=FINAL_USER;$('#cm_you').textContent=r2(TOTAL-FINAL_USER);
  }else{card.classList.remove('active');box.style.height=box.scrollHeight+'px';box.offsetHeight;requestAnimationFrame(()=>{box.style.height='0px';box.classList.remove('open')})}
}
$('#cm_user').addEventListener('input',function(){
  let u=parseFloat(this.value)||0;if(u<0){u=0;this.value=0}
  if(u>TOTAL){this.style.color='#e53935';$('#cm_you').textContent=0;return}
  this.style.color='';$('#cm_you').textContent=r2(TOTAL-u);
});
function applyCustomAmount(){
  const u=r2(parseFloat($('#cm_user').value));
  if(!(u>=0)||u>TOTAL){toast('User amount must be between 0 and '+TOTAL,'error');return}
  FINAL_USER=u;FINAL_YOU=r2(TOTAL-u);CUSTOM_SET=true;
  animateNumber($('#subtitleAmount'),FINAL_YOU);
  toggleCustomBox('close');toast('Custom amount applied','success');
  if($('#linkBox').classList.contains('show'))referNow(true);
}
function referNow(silent){
  const upi=$('#upi_address').value.trim().toLowerCase();
  if(!ENABLED){toast('Refer & Earn is currently closed','error');return}
  if(!UPI_RE.test(upi)){toast('Enter a valid UPI ID (name@bank)','error');return}
  $('#page-loader').classList.add('show');$('#submit_btn').disabled=true;
  const body={upi,cid:CID};if(CUSTOM&&CUSTOM_SET)body.user_amount=FINAL_USER;
  fetch(API+'/upi/refer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json()).then(j=>{
    $('#page-loader').classList.remove('show');$('#submit_btn').disabled=false;
    if(!j.ok){toast(j.error||'Something went wrong','error');return}
    $('#referLink').value=j.link;$('#linkBox').classList.add('show');
    TOTAL=j.total;FINAL_USER=j.new_amt;FINAL_YOU=j.ref_amt;animateNumber($('#subtitleAmount'),FINAL_YOU);
    $('#linkNote').textContent='Your friend gets ₹'+j.new_amt+' and you get ₹'+j.ref_amt+' once your friend completes the offer.';
    if(!silent)toast('Refer link is ready','success');
  }).catch(()=>{$('#page-loader').classList.remove('show');$('#submit_btn').disabled=false;toast('Something went wrong','error')});
}
function copyLink(){const v=$('#referLink').value;
  const ok=()=>toast('Refer link copied','success');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(ok,fb);else fb();
  function fb(){const i=$('#referLink');i.select();try{document.execCommand('copy');ok()}catch(e){toast('Could not copy, please copy manually','error')}}}
fetch(API+'/upi/offers?cid='+encodeURIComponent(CID)).then(r=>r.json()).then(j=>{
  if(!j.ok)throw 0;
  const offers=j.offers||[];let o=null;
  if(CID){o=j.match&&j.match.upi?j.match:null;
    if(!o){$('#offerName').textContent='Offer not available';$('#submit_btn').disabled=true;
      toast(j.match?'This offer is not available for UPI Refer & Earn':'Offer not found. Please check your link','error');return}}
  else{o=offers[0]||null}
  if(o){CID=o.cid;$('#offerName').textContent=o.name}else{$('#offerName').textContent='No offer available';$('#submit_btn').disabled=true}
  const rf=j.refer||{};ENABLED=rf.enabled!==false;CUSTOM=rf.custom!==false;
  if(rf.share){TOTAL=r2(o?o.payout:0);FINAL_USER=r2(TOTAL/2);FINAL_YOU=r2(TOTAL-FINAL_USER)}else{TOTAL=r2((rf.new_amt||0)+(rf.ref_amt||0));FINAL_USER=r2(rf.new_amt||0);FINAL_YOU=r2(rf.ref_amt||0)}
  animateNumber($('#subtitleAmount'),FINAL_YOU);
  if(!CUSTOM)$('#customWrap').style.display='none';
  if(!ENABLED)toast('Refer & Earn is currently closed','error');
}).catch(()=>{$('#offerName').textContent='CashFlix';toast('Could not connect to the server','error')});
</script></body></html>
